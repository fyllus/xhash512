[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xhash"
version = "0.4.2"
description = "A procedural lightweight hash library with state-isolated PRNG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.hatch.build.targets.wheel]
packages = ["xhash"]